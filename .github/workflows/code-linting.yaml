name: Code Linting
on: pull_request

jobs:
  eslint:
    name: Eslint
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: 📦 Install pnpm
        with:
          version: 10
          run_install: false

      - name: 📦 Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 📀 Install dependencies
        run: pnpm install

      - name: 🧹 Run linting with Eslint
        run: pnpm lint:check
